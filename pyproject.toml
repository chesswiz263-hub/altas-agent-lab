[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agent-lab"
version = "1.0.0"
description = "Model-agnostic, traceable agent workbench with local RAG, tools, and evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ATLAS Contributors"}]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.6,<1"]
mcp = ["mcp>=1.0,<3"]
semantic = ["sentence-transformers>=3.0,<6"]
nli = ["transformers>=4.40,<6", "torch>=2.2"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
